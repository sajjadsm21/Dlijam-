<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Dlijam</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050505;
    }

    canvas {
      display: block;
    }
  </style>
</head>

<body>

<script src="https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.min.js"></script>

<script>

const scene = new THREE.Scene();

scene.background =
  new THREE.Color(0x101522);

const camera =
  new THREE.PerspectiveCamera(
    60,
    innerWidth / innerHeight,
    0.1,
    1000
  );

camera.position.set(0, 5, 10);

const renderer =
  new THREE.WebGLRenderer({
    antialias: true
  });

renderer.setSize(
  innerWidth,
  innerHeight
);

renderer.setPixelRatio(
  Math.min(devicePixelRatio, 2)
);

document.body.appendChild(
  renderer.domElement
);


// LIGHT

const sunlight =
  new THREE.DirectionalLight(
    0xffffff,
    2
  );

sunlight.position.set(
  10,
  20,
  10
);

scene.add(sunlight);


// GROUND

const ground =
  new THREE.Mesh(

    new THREE.BoxGeometry(
      50,
      0.5,
      50
    ),

    new THREE.MeshStandardMaterial({
      color: 0x252525
    })

  );

ground.position.y = -0.25;

scene.add(ground);


// PLAYER

const player =
  new THREE.Mesh(

    new THREE.BoxGeometry(
      1,
      2,
      1
    ),

    new THREE.MeshStandardMaterial({
      color: 0x246bff
    })

  );

player.position.y = 1;

scene.add(player);


// GAME LOOP

function gameLoop() {

  requestAnimationFrame(
    gameLoop
  );

  renderer.render(
    scene,
    camera
  );
}

gameLoop();


// RESIZE

window.addEventListener(
  "resize",
  () => {

    camera.aspect =
      innerWidth / innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );

  }
);

</script>

</body>
</html>
