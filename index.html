<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0,
        maximum-scale=1.0, user-scalable=no">

  <title>Dli World</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050505;
      touch-action: none;
    }

    canvas {
      display: block;
    }

    /* Phone rotate message */
    #rotateMessage {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;

      background: #050505;
      color: white;

      font-family: Arial, sans-serif;

      align-items: center;
      justify-content: center;
      flex-direction: column;

      text-align: center;
    }

    #rotateMessage .icon {
      font-size: 55px;
      margin-bottom: 15px;
    }

    #rotateMessage h2 {
      margin: 0 0 8px;
    }

    #rotateMessage p {
      margin: 0;
      opacity: 0.7;
    }
  </style>
</head>

<body>

<!-- ROTATE SCREEN -->

<div id="rotateMessage">

  <div class="icon">📱↻</div>

  <h2>Rotate Your Phone</h2>

  <p>
    Turn your phone sideways to play Dli World.
  </p>

</div>

);

document.body.appendChild(

);

      50,
      0.5,

    ),

    new THREE.MeshStandardMaterial({
      color: 0x252525
    })

  );

scene.add(ground);

      1,
      2,
      1
    ),

    new THREE.MeshStandardMaterial({
      color: 0x246bff
    })

  );

player.position.y = 1;

scene.add(player);
